<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CoffeeShopNomad — Recently Added</title>
<meta name="description" content="Coffee shops added to the CoffeeShopNomad log in the last 24 hours." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B140F;
    --surface: #241B14;
    --rule: #3E3021;
    --text: #EDE3D3;
    --text-muted: #A69684;
    --text-faint: #6E6154;
    --accent: #C99A44;
    --font-display: 'Fraunces', serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px;
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    color: var(--text);
  }

  .window {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .sub {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 20px;
  }

  ul.feed {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--rule);
  }

  li.entry {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
  }

  .entry-main {
    min-width: 0;
  }

  .entry-shop {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-loc {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  .entry-time {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .empty-state, .loading-state, .error-state {
    padding: 32px 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  .error-state { color: #D98C6B; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Recently Added</h1>
      <span class="window">Last 24 hrs</span>
    </div>
    <p class="sub">Coffee shops newly logged to the CoffeeShopNomad database.</p>

    <div id="container">
      <div class="loading-state">Loading…</div>
    </div>
  </div>

<script>
(function () {
  const container = document.getElementById("container");

  function timeAgo(isoString) {
    const diffMs = Date.now() - new Date(isoString).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.round(mins / 60);
    return hrs + "h ago";
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function locationLine(v) {
    return [v.area, v.borough, v.city].filter(Boolean).join(", ");
  }

  function render(visits) {
    if (visits.length === 0) {
      container.innerHTML = '<div class="empty-state">Nothing new in the last 24 hours — check back soon.</div>';
      return;
    }

    const html = [
      '<ul class="feed">',
      ...visits.map((v) => `
        <li class="entry">
          <div class="entry-main">
            <div class="entry-shop">${escapeHtml(v.shop)}</div>
            <div class="entry-loc">${escapeHtml(locationLine(v))}</div>
          </div>
          <div class="entry-time">${timeAgo(v.createdTime)}</div>
        </li>
      `),
      '</ul>',
    ].join("");

    container.innerHTML = html;
  }

  async function init() {
    try {
      const res = await fetch("/api/recent");
      if (!res.ok) throw new Error("Request failed: " + res.status);
      const data = await res.json();
      render(data.visits || []);
    } catch (err) {
      console.error(err);
      container.innerHTML = '<div class="error-state">Couldn\'t load recent activity. Please refresh.</div>';
    }
  }

  init();
})();
</script>
</body>
</html>
